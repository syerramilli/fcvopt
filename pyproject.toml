[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fcvopt"
version = "0.4.0"
description = "Fractional K-fold cross-validation for hyperparameter optimization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Suraj Yerramilli", email = "surajyerramilli@gmail.com"},
    {name = "Daniel W. Apley"},
]
maintainers = [
    {name = "Suraj Yerramilli", email = "surajyerramilli@gmail.com"},
]
keywords = [
    "hyperparameter-optimization",
    "cross-validation",
    "bayesian-optimization",
    "gaussian-processes",
    "machine-learning",
    "automl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"

dependencies = [
    "torch>=2.3.1",
    "gpytorch>=1.14",
    "botorch>=0.12",
    "ConfigSpace>=1.0,<2.0",
    "mlflow>=2.10",
    "numpy>=2.0",
    "scipy>=1.12",
    "scikit-learn>=1.4.2",
    "skorch>=0.15",
    "pandas>=2.2.2",
    "xgboost>=2.0.0,<3",
    "joblib>=1.3",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.2",
    "smac>=2.0,<3.0",
    "optuna>=3.6.0,<4.0.0",
    "lightgbm>=4.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
    "sphinx-autodoc-typehints",
    "nbsphinx",
    "ipykernel",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/syerramilli/fcvopt"
Documentation = "https://syerramilli.github.io/fcvopt/"
Repository = "https://github.com/syerramilli/fcvopt.git"
Issues = "https://github.com/syerramilli/fcvopt/issues"

[tool.hatch.build.targets.wheel]
packages = ["fcvopt"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
